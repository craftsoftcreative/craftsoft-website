server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sıkıştırma
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml font/woff2;

    # Güvenlik başlıkları (nginx add_header devralmaz: her location'da tekrarlanır)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Statik varlıklar — uzun önbellek (hash'li dosya adları sayesinde güvenli)
    location ~* \.(js|css|woff2|png|jpe?g|webp|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Prerender edilmiş sayfalar varsa onları servis et; yoksa SPA kabına düş
    # ($uri/index.html: dizin için 301 redirect yerine doğrudan servis eder)
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
